<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Today's Mock Test - Sampuran English</title>
<style>
:root{
--page-bg:#f2f2f2;
--card-bg:#ffffff;
--card-text:#222222;
--card-border:rgba(13,78,166,0.15);
--accent:#0d4ea6;
--accent-hover:#083b7d;
--footer-bg:#222222;
--footer-text:#ffffff;
--secondary-btn-bg:#222222;
--secondary-btn-hover:#000000;
}
html[data-theme="dark"]{
--page-bg:#0b0c0e;
--card-bg:#1b1c1f;
--card-text:#f2f2f2;
--card-border:rgba(255,255,255,0.12);
--accent:#3b82f6;
--accent-hover:#2563eb;
--footer-bg:#000000;
--footer-text:#f2f2f2;
--secondary-btn-bg:#3a3a3a;
--secondary-btn-hover:#555555;
}
body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:var(--page-bg);
transition:background .25s ease;
}
.page-header{
background:var(--accent);
color:white;
padding:20px;
text-align:center;
}
.page-header h1{
margin:0;
font-size:38px;
}
.container{
width:90%;
max-width:1000px;
margin:40px auto;
display:grid;
grid-template-columns:1fr;
gap:20px;
}
.card{
background:var(--card-bg);
color:var(--card-text);
padding:25px;
text-align:center;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.1);
border:1px solid var(--card-border);
}
.card h2{
color:var(--accent);
font-size:22px;
margin-top:0;
}
.card p{
font-size:17px;
line-height:1.5;
margin:0;
}
.button{
display:inline-block;
margin-top:15px;
padding:12px 25px;
background:var(--accent);
color:white;
text-decoration:none;
border-radius:6px;
font-size:18px;
}
.button:hover{
background:var(--accent-hover);
}
.back{
margin-top:40px;
text-align:center;
grid-column:1/-1;
}
.back a{
text-decoration:none;
background:var(--secondary-btn-bg);
color:white;
padding:12px 25px;
border-radius:6px;
font-size:18px;
}
.back a:hover{
background:var(--secondary-btn-hover);
}
footer{
margin-top:50px;
background:var(--footer-bg);
color:var(--footer-text);
text-align:center;
padding:20px;
}
</style>
</head>
<body>
<div id="site-header"></div>
<div class="page-header">
<h1>Today's Mock Test</h1>
</div>
<div class="container">
<div class="card">
<h2 id="statusTitle">📝 Finding today's mock test…</h2>
<p id="statusText">Please wait a moment.</p>
<a class="button" id="statusBtn" href="mock-tests.html" style="display:none">Browse All Mock Tests</a>
<noscript>
<p>Please turn on JavaScript to open today's mock test.</p>
<a class="button" href="mock-tests.html">Browse All Mock Tests</a>
</noscript>
</div>
<div class="back">
<a href="index.html">← Back to Home</a>
</div>
</div>
<footer>
© Sampuran English
</footer>
<script>
fetch('header.html')
.then(function(response){ return response.text(); })
.then(function(html){
document.getElementById('site-header').innerHTML = html;
window.scrollTo(0, 0);
document.getElementById('menuToggle').addEventListener('click', function(){
document.getElementById('menuList').classList.toggle('open');
});
});
</script>
<script src="theme.js"></script>
<script>
/*
  HOW THIS PAGE WORKS
  1. It works out today's date (India time).
  2. It opens this month's page (for example september-2026.html) and looks
     for today's link there.
  3. If that link exists AND the file has been uploaded, it opens it.
  4. Otherwise it shows a friendly "not uploaded yet" message.
  So each day you only need to upload the day's file and make sure
  today's link is on the monthly page. Nothing else to edit.
*/
(function(){
var MONTHS = ['january','february','march','april','may','june','july','august','september','october','november','december'];
var MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];

function todayIndia(){
  try {
    var parts = new Intl.DateTimeFormat('en-GB', {timeZone:'Asia/Kolkata', day:'numeric', month:'numeric', year:'numeric'}).formatToParts(new Date());
    var o = {};
    parts.forEach(function(p){
      if(p.type === 'day' || p.type === 'month' || p.type === 'year'){ o[p.type] = parseInt(p.value, 10); }
    });
    if(o.day && o.month && o.year){ return o; }
  } catch(e) {}
  var n = new Date();
  return {day:n.getDate(), month:n.getMonth() + 1, year:n.getFullYear()};
}

var t = todayIndia();
var dateKey = t.day + '-' + t.month + '-' + t.year;
var dateLabel = t.day + ' ' + MONTH_NAMES[t.month - 1] + ' ' + t.year;
var monthPage = MONTHS[t.month - 1] + '-' + t.year + '.html';

function matches(href){
  return href.indexOf(dateKey + ' English Mock Test') === 0;
}

function findTarget(html){
  var doc = new DOMParser().parseFromString(html, 'text/html');
  var links = doc.querySelectorAll('a[href]');
  for(var i = 0; i < links.length; i++){
    var href = links[i].getAttribute('href');
    try { href = decodeURIComponent(href); } catch(e) {}
    if(matches(href)){ return href; }
  }
  return null;
}

function showNotReady(){
  document.getElementById('statusTitle').textContent = '⏳ Not uploaded yet';
  document.getElementById('statusText').textContent = "Today's mock test (" + dateLabel + ") has not been uploaded yet. Please check back soon.";
  document.getElementById('statusBtn').style.display = 'inline-block';
}

fetch(monthPage, {cache:'no-cache'})
.then(function(r){
  if(!r.ok){ throw new Error('month page not found'); }
  return r.text();
})
.then(function(html){
  var target = findTarget(html);
  if(!target){ throw new Error('no link for today'); }
  var url = encodeURI(target);
  return fetch(url, {method:'HEAD', cache:'no-cache'}).then(function(r){
    if(!r.ok){ throw new Error('file not uploaded'); }
    return url;
  });
})
.then(function(url){
  window.location.replace(url);
})
.catch(showNotReady);
})();
</script>
</body>
</html>
