<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grammar - Sampuran English</title>
<style>
:root{
--page-bg:#f2f2f2;
--card-bg:#ffffff;
--card-text:#222222;
--accent:#004aad;
--accent-hover:#00317c;
--footer-bg:#222222;
--footer-text:#ffffff;
}
html[data-theme="dark"]{
--page-bg:#0b0c0e;
--card-bg:#1b1c1f;
--card-text:#f2f2f2;
--accent:#3b82f6;
--accent-hover:#2563eb;
--footer-bg:#000000;
--footer-text:#f2f2f2;
}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--page-bg);transition:background .25s ease;}
header{background:var(--accent);color:white;padding:20px;text-align:center;}
h1{margin:0;font-size:38px;}
.container{width:90%;max-width:1000px;margin:40px auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;}
.mock{background:var(--card-bg);color:var(--card-text);padding:25px;text-align:center;border-radius:10px;box-shadow:0 0 10px rgba(0,0,0,.1);transition:background .25s ease,color .25s ease;}
.mock h2{margin-top:0;color:var(--accent);font-size:22px;}
.mock p{margin:0 0 5px;color:var(--card-text);}
.button{display:inline-block;margin-top:15px;padding:12px 25px;background:var(--accent);color:white;text-decoration:none;border-radius:6px;font-size:18px;}
.button:hover{background:var(--accent-hover);}
.back{margin-top:20px;text-align:center;grid-column:1/-1;}
.back a{text-decoration:none;background:#222;color:white;padding:12px 25px;border-radius:6px;font-size:18px;}
footer{margin-top:50px;background:var(--footer-bg);color:var(--footer-text);text-align:center;padding:20px;}
</style>
</head>
<body>
<div id="site-header"></div>
<header>
<h1>Grammar</h1>
</header>
<div class="container">
<div class="mock">
<h2>Notes</h2>
<a class="button" href="notes-grammar.html">Open</a>
</div>
<div class="mock">
<h2>Mock Test</h2>
<p>Topic-wise Practice</p>
<a class="button" href="mock-test-grammar.html">Open</a>
</div>
<div class="mock">
<h2>Mock Test</h2>
<p>Mix Practice</p>
<a class="button" href="mock-test-mix-grammar.html">Open</a>
</div>
<div class="back">
<a href="index.html">← Back to Home</a>
</div>
</div>
<footer>
© Sampuran English
</footer>
<script>
fetch('header.html')
.then(function(response){ return response.text(); })
.then(function(html){
document.getElementById('site-header').innerHTML = html;
window.scrollTo(0, 0);
document.getElementById('menuToggle').addEventListener('click', function(){
document.getElementById('menuList').classList.toggle('open');
});
});
</script>
<script src="theme.js"></script>
</body>
</html>
