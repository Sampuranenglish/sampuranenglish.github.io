<!DOCTYPE html>
<html lang="en">
<head>
<script>
if ('scrollRestoration' in history) { history.scrollRestoration = 'manual'; }
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mock Tests - Sampuran English</title>
<style>
body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:#f2f2f2;
}
.page-header{
background:#1f2937;
color:white;
padding:20px;
text-align:center;
}
.page-header h1{
margin:0;
font-size:38px;
}
.container{
width:90%;
max-width:1000px;
margin:40px auto;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
}
.card{
background:white;
padding:25px;
text-align:center;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.1);
transition:.3s;
}
.card:hover{
transform:translateY(-3px);
}
.card h2{
color:#004aad;
font-size:22px;
margin-top:0;
}
.button{
display:inline-block;
margin-top:15px;
padding:12px 25px;
background:#004aad;
color:white;
text-decoration:none;
border-radius:6px;
font-size:18px;
}
.button:hover{
background:#00317c;
}
.back{
margin-top:40px;
text-align:center;
grid-column:1/-1;
}
.back a{
text-decoration:none;
background:#222;
color:white;
padding:12px 25px;
border-radius:6px;
font-size:18px;
}
.back a:hover{
background:#000;
}
footer{
margin-top:50px;
background:#222;
color:white;
text-align:center;
padding:20px;
}
</style>
</head>
<body>
<div id="site-header"></div>
<div class="page-header">
<h1>Mock Tests</h1>
</div>
<div class="container">

<div class="card">
<h2>📅 2026</h2>
<a class="button" href="2026.html">Open</a>
</div>

<div class="back">
<a href="index.html">← Back to Home</a>
</div>
</div>
<footer>
© Sampuran English
</footer>
<script>
fetch('header.html')
  .then(function(response){ return response.text(); })
  .then(function(html){
    document.getElementById('site-header').innerHTML = html;
    window.scrollTo(0, 0);
    document.getElementById('menuToggle').addEventListener('click', function(){
      document.getElementById('menuList').classList.toggle('open');
    });
  });
</script>
</body>
</html>
