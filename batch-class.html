<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Batch Class - Sampuran English</title>
<style>
:root{
--page-bg:#f2f2f2;
--card-bg:#ffffff;
--card-text:#222222;
--card-border:rgba(13,78,166,0.15);
--accent:#0d4ea6;
--accent-hover:#083b7d;
--footer-bg:#222222;
--footer-text:#ffffff;
--secondary-btn-bg:#222222;
--secondary-btn-hover:#000000;
}
html[data-theme="dark"]{
--page-bg:#0b0c0e;
--card-bg:#1b1c1f;
--card-text:#f2f2f2;
--card-border:rgba(255,255,255,0.12);
--accent:#3b82f6;
--accent-hover:#2563eb;
--footer-bg:#000000;
--footer-text:#f2f2f2;
--secondary-btn-bg:#3a3a3a;
--secondary-btn-hover:#555555;
}
body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:var(--page-bg);
transition:background .25s ease;
}
.page-header{
background:var(--accent);
color:white;
padding:20px;
text-align:center;
}
.page-header h1{
margin:0;
font-size:38px;
}
.wrap{
width:90%;
max-width:1000px;
margin:40px auto;
}


.card-box{
background:var(--card-bg);
color:var(--card-text);
border:1px solid var(--card-border);
border-radius:12px;
box-shadow:0 0 10px rgba(0,0,0,.1);
padding:40px 25px;
text-align:center;
}
.card-box h2{
margin:0 0 8px;
color:var(--accent);
}
.card-box p{
margin:0;
font-size:17px;
}
.back{
margin-top:50px;
text-align:center;
}
.back a{
text-decoration:none;
background:var(--secondary-btn-bg);
color:white;
padding:12px 25px;
border-radius:6px;
font-size:18px;
}
.back a:hover{
background:var(--secondary-btn-hover);
}
footer{
margin-top:50px;
background:var(--footer-bg);
color:var(--footer-text);
text-align:center;
padding:20px;
}
@media (max-width:600px){
.page-header h1{ font-size:30px; }
}
</style>
</head>
<body>

<div id="site-header"></div>

<div class="page-header">
<h1>Batch Class</h1>
</div>

<div class="wrap">

<div class="card-box">
<h2>Batch Class</h2>
<p>Details coming soon.</p>
</div>

<div class="back">
<a href="index.html">← Back to Home</a>
</div>

</div>

<footer>
© Sampuran English
</footer>

<script>
fetch('header.html')
.then(function(response){ return response.text(); })
.then(function(html){
document.getElementById('site-header').innerHTML = html;
window.scrollTo(0, 0);
document.getElementById('menuToggle').addEventListener('click', function(){
document.getElementById('menuList').classList.toggle('open');
});
});
</script>
<script src="theme.js"></script>
</body>
</html>
