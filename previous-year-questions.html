<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Previous Year Questions</title>
<style>
:root{
--page-bg:#f2f2f2;
--card-bg:#ffffff;
--card-text:#222222;
--card-border:rgba(13,78,166,0.15);
--accent:#0d4ea6;
--accent-hover:#083b7d;
--footer-bg:#222222;
--footer-text:#ffffff;
--secondary-btn-bg:#222222;
--secondary-btn-hover:#000000;
}
html[data-theme="dark"]{
--page-bg:#0b0c0e;
--card-bg:#1b1c1f;
--card-text:#f2f2f2;
--card-border:rgba(255,255,255,0.12);
--accent:#3b82f6;
--accent-hover:#2563eb;
--footer-bg:#000000;
--footer-text:#f2f2f2;
--secondary-btn-bg:#3a3a3a;
--secondary-btn-hover:#555555;
}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--page-bg);transition:background .25s ease;}
header{background:var(--accent);color:white;padding:20px;text-align:center;}
h1{margin:0;font-size:38px;}
.container{width:90%;max-width:1000px;margin:40px auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;}
.card{background:var(--card-bg);color:var(--card-text);padding:25px;text-align:center;border-radius:10px;box-shadow:0 0 10px rgba(0,0,0,.1);border:1px solid var(--card-border);transition:background .25s ease,color .25s ease;}
.card h2{color:var(--accent);font-size:22px;margin-top:0;}
.button{display:inline-block;margin-top:15px;padding:12px 25px;background:var(--accent);color:white;text-decoration:none;border-radius:6px;font-size:18px;}
.button:hover{background:var(--accent-hover);}
.back{margin-top:40px;text-align:center;grid-column:1/-1;}
.back a{text-decoration:none;background:var(--secondary-btn-bg);color:white;padding:12px 25px;border-radius:6px;font-size:18px;}
footer{margin-top:50px;background:var(--footer-bg);color:var(--footer-text);text-align:center;padding:20px;}
</style>
</head>
<body>
<div id="site-header"></div>
<header>
<h1>Previous Year Questions</h1>
</header>
<div class="container">
<div class="card">
<h2>Mock Test</h2>
<p>Topic-wise PYQs</p>
<a class="button" href="Mock-Test-PYQ.html">Open</a>
</div>
<div class="card">
<h2>PDF</h2>
<p>Download PYQs</p>
<a class="button" href="PDF-PYQ.html">Open</a>
</div>
<div class="back">
<a href="index.html">← Back to Home</a>
</div>
</div>
<footer>© Sampuran English</footer>
<script>
fetch('header.html')
.then(function(response){ return response.text(); })
.then(function(html){
document.getElementById('site-header').innerHTML = html;
window.scrollTo(0, 0);
document.getElementById('menuToggle').addEventListener('click', function(){
document.getElementById('menuList').classList.toggle('open');
});
var sitePages = [
{name:"Home", href:"index.html"},
{name:"Mock Tests", href:"mock-tests.html"},
{name:"Grammar", href:"grammar.html"},
{name:"Vocabulary", href:"vocab.html"},
{name:"Editorial", href:"editorial.html"},
{name:"Reading Section", href:"reading.html"},
{name:"Previous Year Questions", href:"previous-year-questions.html"},
{name:"About", href:"about.html"}
];
var searchBtn = document.getElementById('searchBtn');
var searchPanel = document.getElementById('searchPanel');
var searchInput = document.getElementById('searchInput');
var searchResults = document.getElementById('searchResults');
function renderResults(query){
var q = query.trim().toLowerCase();
var matches = q === '' ? sitePages : sitePages.filter(function(item){
return item.name.toLowerCase().indexOf(q) !== -1;
});
searchResults.innerHTML = '';
if(matches.length === 0){
var li = document.createElement('li');
li.className = 'no-result';
li.textContent = 'No matching page found';
searchResults.appendChild(li);
return;
}
matches.forEach(function(item){
var li = document.createElement('li');
var a = document.createElement('a');
a.href = item.href;
a.textContent = item.name;
li.appendChild(a);
searchResults.appendChild(li);
});
}
if(searchBtn){
searchBtn.addEventListener('click', function(e){
e.stopPropagation();
searchPanel.classList.toggle('open');
if(searchPanel.classList.contains('open')){
searchInput.value = '';
renderResults('');
searchInput.focus();
}
});
searchInput.addEventListener('input', function(){
renderResults(searchInput.value);
});
searchInput.addEventListener('keydown', function(e){
if(e.key === 'Enter'){
var firstLink = searchResults.querySelector('a');
if(firstLink){ window.location.href = firstLink.href; }
}
if(e.key === 'Escape'){
searchPanel.classList.remove('open');
}
});
document.addEventListener('click', function(e){
if(!searchPanel.contains(e.target) && e.target !== searchBtn){
searchPanel.classList.remove('open');
}
});
}
});
</script>
<script src="theme.js"></script>
</body>
</html>
