<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact - Sampuran English</title>
<style>
:root{
--page-bg:#f2f2f2;
--card-bg:#ffffff;
--card-text:#222222;
--card-border:rgba(13,78,166,0.15);
--accent:#0d4ea6;
--accent-hover:#083b7d;
--footer-bg:#222222;
--footer-text:#ffffff;
--secondary-btn-bg:#222222;
--secondary-btn-hover:#000000;
}
html[data-theme="dark"]{
--page-bg:#0b0c0e;
--card-bg:#1b1c1f;
--card-text:#f2f2f2;
--card-border:rgba(255,255,255,0.12);
--accent:#3b82f6;
--accent-hover:#2563eb;
--footer-bg:#000000;
--footer-text:#f2f2f2;
--secondary-btn-bg:#3a3a3a;
--secondary-btn-hover:#555555;
}
body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:var(--page-bg);
transition:background .25s ease;
}
.page-header{
background:var(--accent);
color:white;
padding:20px;
text-align:center;
}
.page-header h1{
margin:0;
font-size:38px;
}
.wrap{
width:90%;
max-width:1000px;
margin:40px auto;
}

/* ---------- Section titles ---------- */
.section-title{
text-align:center;
margin:0 0 6px;
color:var(--accent);
font-size:28px;
}
.section-sub{
text-align:center;
margin:0 0 24px;
color:var(--card-text);
opacity:.75;
font-size:16px;
}

/* ---------- Contact box ---------- */
.contact-box{
background:var(--card-bg);
color:var(--card-text);
border:1px solid var(--card-border);
border-radius:12px;
box-shadow:0 0 10px rgba(0,0,0,.1);
padding:32px 25px;
text-align:center;
}
.contact-box .icon{
font-size:40px;
line-height:1;
}
.contact-box h3{
margin:10px 0 6px;
font-size:22px;
color:var(--accent);
}
.contact-box p{
margin:0;
font-size:16px;
line-height:1.5;
}
.email-link{
display:inline-block;
margin-top:14px;
font-size:22px;
font-weight:bold;
color:var(--accent);
text-decoration:none;
overflow-wrap:anywhere;
border-bottom:2px solid var(--accent);
}
.email-link:hover{
color:var(--accent-hover);
border-bottom-color:var(--accent-hover);
}
.divider{
height:1px;
background:var(--card-border);
margin:28px auto;
max-width:520px;
}
.btn-row{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:12px;
}
.btn{
display:inline-block;
padding:12px 22px;
background:var(--accent);
color:#ffffff;
text-decoration:none;
border-radius:6px;
font-size:17px;
font-weight:bold;
}
.btn:hover{
background:var(--accent-hover);
}
.btn.yt{
background:#e00000;
}
.btn.yt:hover{
background:#b30000;
}

.back{
margin-top:50px;
text-align:center;
}
.back a{
text-decoration:none;
background:var(--secondary-btn-bg);
color:white;
padding:12px 25px;
border-radius:6px;
font-size:18px;
}
.back a:hover{
background:var(--secondary-btn-hover);
}
footer{
margin-top:50px;
background:var(--footer-bg);
color:var(--footer-text);
text-align:center;
padding:20px;
}

@media (max-width:600px){
.page-header h1{ font-size:30px; }
.section-title{ font-size:24px; }
.email-link{ font-size:18px; }
.btn{ width:100%; box-sizing:border-box; text-align:center; }
.btn-row{ flex-direction:column; }
}
</style>
</head>
<body>
<div id="site-header"></div>

<div class="page-header">
<h1>Contact</h1>
</div>

<div class="wrap">

<div class="contact-box">
<div class="icon">📧</div>
<h3>Get in Touch with Me</h3>
<p>For any question, suggestion or feedback, write to me at</p>
<a class="email-link" href="mailto:sampuranenglish@gmail.com">sampuranenglish@gmail.com</a>

<div class="divider"></div>

<h3>Join Us</h3>
<p>Follow us to never miss a day of practice</p>
<div class="btn-row" style="margin-top:16px;">
<a class="btn" href="https://t.me/sampuranenglish" target="_blank" rel="noopener noreferrer">🧠 Daily Quiz</a>
<a class="btn" href="https://t.me/Sampuran_English" target="_blank" rel="noopener noreferrer">Telegram Content</a>
<a class="btn yt" href="https://www.youtube.com/@SampuranEnglish" target="_blank" rel="noopener noreferrer">YouTube</a>
</div>
</div>

<div class="back">
<a href="index.html">← Back to Home</a>
</div>

</div>

<footer>
© Sampuran English
</footer>

<script>
fetch('header.html')
.then(function(response){ return response.text(); })
.then(function(html){
document.getElementById('site-header').innerHTML = html;
window.scrollTo(0, 0);
document.getElementById('menuToggle').addEventListener('click', function(){
document.getElementById('menuList').classList.toggle('open');
});
});
</script>
<script src="theme.js"></script>
</body>
</html>
