<!DOCTYPE html>
<html lang="en">
<head>
<script>
if ('scrollRestoration' in history) { history.scrollRestoration = 'manual'; }
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 Daily Mock Tests</title>
<style>
:root{
--page-bg:#f2f2f2;
--card-bg:#ffffff;
--card-text:#222222;
--card-border:rgba(13,78,166,0.15);
--accent:#0d4ea6;
--accent-hover:#083b7d;
--footer-bg:#222222;
--footer-text:#ffffff;
}
html[data-theme="dark"]{
--page-bg:#0b0c0e;
--card-bg:#1b1c1f;
--card-text:#f2f2f2;
--card-border:rgba(255,255,255,0.12);
--accent:#3b82f6;
--accent-hover:#2563eb;
--footer-bg:#000000;
--footer-text:#f2f2f2;
}
body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:var(--page-bg);
transition:background .25s ease;
}
.page-header{
background:var(--accent);
color:white;
padding:20px;
text-align:center;
}
.page-header h1{
margin:0;
font-size:38px;
}
.container{
width:90%;
max-width:1000px;
margin:40px auto;
}
.month{
background:var(--card-bg);
padding:20px;
margin-bottom:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.1);
border:1px solid var(--card-border);
transition:.3s;
}
.month:hover{
transform:translateY(-3px);
}
.month a{
text-decoration:none;
font-size:24px;
font-weight:bold;
color:var(--accent);
display:block;
}
.back{
margin-top:40px;
text-align:center;
}
.back a{
text-decoration:none;
background:var(--accent);
color:white;
padding:12px 25px;
border-radius:6px;
font-size:18px;
}
.back a:hover{
background:var(--accent-hover);
}
footer{
margin-top:50px;
background:var(--footer-bg);
color:var(--footer-text);
text-align:center;
padding:20px;
}
</style>
</head>
<body>
<div id="site-header"></div>
<div class="page-header">
<h1>2026 Daily Mock Tests</h1>
</div>
<div class="container">
<div class="month">
<a href="july-2026.html">📅 July</a>
</div>
<div class="month">
<a href="august-2026.html">📅 August</a>
</div>
<div class="month">
<a href="september-2026.html">📅 September</a>
</div>
<div class="month">
<a href="october-2026.html">📅 October</a>
</div>
<div class="month">
<a href="november-2026.html">📅 November</a>
</div>
<div class="month">
<a href="december-2026.html">📅 December</a>
</div>
<div class="back">
<a href="mock-tests.html">← Back to Mock Tests</a>
</div>
</div>
<footer>
© Sampuran English
</footer>
<script>
fetch('header.html')
.then(function(response){ return response.text(); })
.then(function(html){
document.getElementById('site-header').innerHTML = html;
window.scrollTo(0, 0);
document.getElementById('menuToggle').addEventListener('click', function(){
document.getElementById('menuList').classList.toggle('open');
});
var sitePages = [
{name:"Home", href:"index.html"},
{name:"Mock Tests", href:"mock-tests.html"},
{name:"Grammar", href:"grammar.html"},
{name:"Vocabulary", href:"vocab.html"},
{name:"Editorial", href:"editorial.html"},
{name:"Reading Section", href:"reading.html"},
{name:"Previous Year Questions", href:"previous-year-questions.html"},
{name:"About", href:"about.html"}
];
var searchBtn = document.getElementById('searchBtn');
var searchPanel = document.getElementById('searchPanel');
var searchInput = document.getElementById('searchInput');
var searchResults = document.getElementById('searchResults');
function renderResults(query){
var q = query.trim().toLowerCase();
var matches = q === '' ? sitePages : sitePages.filter(function(item){
return item.name.toLowerCase().indexOf(q) !== -1;
});
searchResults.innerHTML = '';
if(matches.length === 0){
var li = document.createElement('li');
li.className = 'no-result';
li.textContent = 'No matching page found';
searchResults.appendChild(li);
return;
}
matches.forEach(function(item){
var li = document.createElement('li');
var a = document.createElement('a');
a.href = item.href;
a.textContent = item.name;
li.appendChild(a);
searchResults.appendChild(li);
});
}
if(searchBtn){
searchBtn.addEventListener('click', function(e){
e.stopPropagation();
searchPanel.classList.toggle('open');
if(searchPanel.classList.contains('open')){
searchInput.value = '';
renderResults('');
searchInput.focus();
}
});
searchInput.addEventListener('input', function(){
renderResults(searchInput.value);
});
searchInput.addEventListener('keydown', function(e){
if(e.key === 'Enter'){
var firstLink = searchResults.querySelector('a');
if(firstLink){ window.location.href = firstLink.href; }
}
if(e.key === 'Escape'){
searchPanel.classList.remove('open');
}
});
document.addEventListener('click', function(e){
if(!searchPanel.contains(e.target) && e.target !== searchBtn){
searchPanel.classList.remove('open');
}
});
}
});
</script>
<script src="theme.js"></script>
</body>
</html>
